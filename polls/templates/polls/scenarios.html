{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scenarios - surviveNova</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>  
    <h1>Random Scenario!</h1>
    {% for scenario in scenarios %}
        <div class="scenario">
            <p>{{ scenario.description }}</p>
            <ul>
                <li>{{ scenario.option1 }}</li>
                <li>{{ scenario.option2 }}</li>
            </ul>
        </div>
    {% endfor %}
</body>
</html>
